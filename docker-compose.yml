services:
  demo-service:
    build: ./demo-service
    ports:
      - "8080:8080"

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
  loadgen:
    build: ./loadgen
    environment:
      - TARGET_URL=http://demo-service:8080/work
      - RATE=10